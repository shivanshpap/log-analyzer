[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "1.0.0"
description = "A high-performance streaming Python CLI tool for log parsing, statistical analysis, filtering, and AI-powered troubleshooting."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-dateutil>=2.8.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
log-analyzer = "log_analyzer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
